<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Wireframes | Locadora Atlas</title>
<style>
*{box-sizing:border-box}body{margin:0;font:14px Arial,sans-serif;color:#26344d;background:#eef1f5}button{font:inherit;cursor:pointer}.wire-head{background:#17213a;color:#fff;padding:23px max(24px,calc((100vw - 1280px)/2));display:flex;justify-content:space-between;align-items:center;gap:15px}.wire-head h1{margin:4px 0 0;font-size:22px}.wire-head p{margin:0;font-size:12px;color:#b9c8e0;line-height:1.45}.tag{color:#d6ff8d;font-size:10px;font-weight:800;letter-spacing:.15em}.tabs{display:flex;gap:7px;flex-wrap:wrap;padding:18px max(24px,calc((100vw - 1280px)/2))}.tabs button{border:1px solid #dbe2ec;border-radius:7px;background:#fff;color:#576780;padding:9px 13px;font-size:12px;font-weight:700}.tabs button.active{background:#3155b0;color:#fff;border-color:#3155b0}.canvas{max-width:1280px;margin:0 auto 40px;padding:0 24px}.caption{margin:0 0 12px;color:#78879c;font-size:12px}.screen{display:none;min-height:640px;background:#f5f7fa;border:1px solid #dce3ec;border-radius:12px;overflow:hidden;box-shadow:0 12px 35px rgba(30,46,74,.12)}.screen.active{display:flex}.side{width:195px;flex:none;background:#17213a;color:#c3cee2;padding:22px 12px}.logo{font-weight:800;letter-spacing:.2em;color:#fff;padding:5px 12px 34px}.logo b{background:#d6ff8d;color:#17213a;padding:7px 9px;border-radius:6px;margin-right:8px}.snav{padding:10px 13px;border-radius:6px;margin:2px 0;font-weight:600;font-size:12px}.snav.sel{background:#34487b;color:#fff}.slabel{color:#8190aa;font-size:9px;font-weight:800;letter-spacing:.14em;padding:8px 13px}.body{min-width:0;flex:1}.top{height:54px;background:#fff;border-bottom:1px solid #e2e7ef;display:flex;align-items:center;justify-content:space-between;padding:0 25px;font-size:11px;color:#7b8aa1}.top b{color:#364761}.main{padding:27px}.eyebrow{color:#7890b8;letter-spacing:.13em;font-weight:800;font-size:10px}.title{font-size:26px;font-weight:800;letter-spacing:-.04em;margin:6px 0}.subtitle{color:#7d8ba0;font-size:12px;margin:0 0 20px}.hero{background:#24365e;color:white;border-radius:10px;padding:25px;min-height:140px}.hero h2{margin:8px 0;font-size:27px}.hero em{font-style:normal;color:#d6ff8d}.hero p{color:#cbd7e7;font-size:12px}.cards{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:13px}.card,.panel{background:#fff;border:1px solid #e4e9f0;border-radius:9px}.card{padding:17px}.card small{display:block;color:#8593a8}.card strong{display:block;font-size:26px;margin:11px 0 2px}.grid{display:grid;grid-template-columns:1.5fr 1fr;gap:12px;margin-top:14px}.panel{padding:20px}.panel h3{margin:0 0 13px;font-size:15px}.line{border-top:1px solid #e8edf2;padding:13px 0;color:#40516c}.line small{float:right;color:#8b99ac}.headrow{display:flex;justify-content:space-between;align-items:center;gap:10px}.primary{background:#3155b0;color:#fff;border:0;border-radius:7px;padding:10px 14px;font-size:12px;font-weight:700}.filters{display:flex;gap:10px;margin-bottom:17px}.field{display:grid;gap:6px;flex:1}.field label{font-size:11px;font-weight:700;color:#65758f}.input{background:#fff;border:1px solid #dce3ec;border-radius:7px;color:#a3afbd;padding:10px;font-size:11px;min-height:36px}.table{width:100%;border-collapse:collapse;background:#fff}.table th{background:#fafbfe;color:#8997ab;font-size:10px;text-align:left;letter-spacing:.07em;padding:12px;border-bottom:1px solid #e7ecf2}.table td{padding:13px 12px;border-bottom:1px solid #edf0f4;color:#4d5c74;font-size:11px}.table td:first-child{font-weight:700;color:#2b3b54}.action{color:#3155b0;font-weight:700}.status{display:inline-block;border-radius:20px;background:#fff1da;color:#9c6b28;padding:4px 7px;font-size:10px;font-weight:700}.status.done{background:#e6f4e5;color:#408050}.form-layout{display:grid;grid-template-columns:1fr 1fr;gap:14px;background:#fff;border:1px solid #e2e8f0;padding:24px;border-radius:9px;max-width:680px}.form-layout .wide{grid-column:1/-1}.form-actions{grid-column:1/-1;display:flex;justify-content:flex-end;gap:9px;margin-top:15px}.secondary{background:#f5f7fb;border:1px solid #dce3ec;color:#51627d;border-radius:7px;padding:9px 13px}.query-grid{display:grid;grid-template-columns:210px 1fr;gap:13px}.query-list{display:grid;align-content:start;gap:8px}.query-item{background:#fff;border:1px solid #e3e9f1;border-radius:7px;padding:13px;font-size:11px;font-weight:700}.query-item.sel{background:#edf3ff;border-color:#9ab2e8;color:#3155b0}.query-pane{background:#fff;border:1px solid #e3e9f1;border-radius:9px;padding:23px}.query-pane h3{margin:6px 0;font-size:17px}.query-pane p{color:#8794a8;font-size:12px}.query-inputs{display:flex;gap:10px;align-items:end;max-width:400px;margin:22px 0}.result{border-top:1px solid #e9edf3;padding-top:15px;color:#718198;font-size:11px}@media(max-width:760px){.side{width:130px}.logo{font-size:10px}.snav{font-size:10px}.main{padding:15px}.cards{grid-template-columns:repeat(2,1fr)}.grid,.query-grid{grid-template-columns:1fr}.wire-head{padding:18px}.tabs{padding:15px}.canvas{padding:0 10px}.screen{overflow:auto}.body{min-width:560px}}
</style>
</head>
<body>
<header class="wire-head"><div><span class="tag">PROTÓTIPO DE ALTA FIDELIDADE</span><h1>Locadora Atlas · Wireframes</h1></div><p>Mapeamento visual das telas do Trabalho Prático 2.<br>Os dados abaixo são ilustrativos; a aplicação usa a API real.</p></header>
<nav class="tabs" aria-label="Telas do protótipo"><button class="active" data-screen="visao">Visão geral</button><button data-screen="cadastros">Cadastros</button><button data-screen="formulario">Formulário</button><button data-screen="alugueis">Aluguéis</button><button data-screen="devolucao">Devolução</button><button data-screen="pagamentos">Pagamentos</button><button data-screen="consultas">Consultas</button></nav>
<div class="canvas"><p id="caption" class="caption">Visão geral: indicadores e atalhos conectados às listagens do backend.</p>
<div id="screen" class="screen active"></div></div>
<script>
const side=sel=>`<aside class="side"><div class="logo"><b>A</b>ATLAS</div><div class="slabel">GESTÃO</div>${['Visão geral','Fabricantes','Veículos','Clientes','Aluguéis','Pagamentos'].map(x=>`<div class="snav ${sel===x?'sel':''}">${x}</div>`).join('')}<div class="slabel">ANÁLISE</div><div class="snav ${sel==='Consultas'?'sel':''}">Consultas</div></aside>`;
const wrap=(sel,content)=>side(sel)+`<div class="body"><div class="top"><span>PAINEL DE CONTROLE / <b>${sel}</b></span><span>AT</span></div><div class="main">${content}</div></div>`;
const table=(headers,rows)=>`<div class="panel" style="padding:0;overflow:auto"><table class="table"><thead><tr>${headers.map(x=>`<th>${x}</th>`).join('')}</tr></thead><tbody>${rows.map(row=>`<tr>${row.map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</tbody></table></div>`;
const title=(eyebrow,name,sub,button)=>`<div class="headrow"><div><div class="eyebrow">${eyebrow}</div><h2 class="title">${name}</h2><p class="subtitle">${sub}</p></div>${button?`<button class="primary">+ Novo ${button}</button>`:''}</div>`;
const filters=(a,b)=>`<div class="filters"><div class="field"><label>${a}</label><div class="input">Buscar por ${a.toLowerCase()}...</div></div><div class="field"><label>${b}</label><div class="input">Buscar por ${b.toLowerCase()}...</div></div><button class="secondary">Limpar filtros</button></div>`;
const screens={
visao:{caption:'Visão geral: indicadores e atalhos conectados às listagens do backend.',html:wrap('Visão geral',`<div class="hero"><span class="eyebrow">GESTÃO DE FROTA</span><h2>Tudo em movimento,<br><em>sob controle.</em></h2><p>Cadastros, locações e pagamentos em um só lugar.</p></div><h2 class="title" style="font-size:20px;margin-top:23px">Visão geral</h2><div class="cards">${[['Veículos cadastrados','24'],['Clientes ativos','112'],['Aluguéis em aberto','08'],['Pagamentos registrados','76']].map(x=>`<div class="card"><small>${x[0]}</small><strong>${x[1]}</strong><small>Dados da API</small></div>`).join('')}</div><div class="grid"><div class="panel"><h3>Aluguéis recentes</h3><div class="line">Marina Costa · Polo <small>Em aberto</small></div><div class="line">Lucas Silva · Argo <small>Devolvido</small></div></div><div class="panel"><h3>Acesso rápido</h3><div class="line">Frota</div><div class="line">Clientes</div><div class="line">Consultas</div></div></div>`)},
cadastros:{caption:'Cadastros: fabricante, veículo e cliente seguem esta estrutura; cada lista possui dois filtros, leitura, edição e exclusão.',html:wrap('Veículos',`${title('CADASTROS','Veículos','Inventário da frota, quilometragem e valor da diária.','veículo')}${filters('Modelo','Placa')}${table(['ID','MODELO','PLACA','FABRICANTE','ANO','QUILOMETRAGEM','DIÁRIA','AÇÕES'],[['01','Polo','ABC1D23','Volkswagen','2022','25.000 km','R$ 150,00','<span class="action">Ver · Editar · Excluir</span>'],['02','Argo','DEF2G34','Fiat','2023','12.000 km','R$ 130,00','<span class="action">Ver · Editar · Excluir</span>']])}`)},
formulario:{caption:'Formulário: os mesmos campos são preenchidos na criação e na edição; os vínculos são selecionados a partir da API.',html:wrap('Veículos',`${title('CADASTROS','Novo veículo','Dados do novo registro da frota.') }<div class="form-layout"><div class="field wide"><label>Fabricante</label><div class="input">Volkswagen</div></div><div class="field"><label>Modelo</label><div class="input">Polo</div></div><div class="field"><label>Placa</label><div class="input">ABC1D23</div></div><div class="field"><label>Ano de fabricação</label><div class="input">2022</div></div><div class="field"><label>Quilometragem</label><div class="input">25000</div></div><div class="field wide"><label>Valor da diária (R$)</label><div class="input">150,00</div></div><div class="form-actions"><button class="secondary">Cancelar</button><button class="primary">Salvar registro</button></div></div>`)},
alugueis:{caption:'Aluguéis: listagem com filtros por cliente e veículo, situação, edição, exclusão e acesso à devolução.',html:wrap('Aluguéis',`${title('OPERAÇÃO','Aluguéis','Períodos, devoluções, quilômetros e valores.','aluguel')}${filters('Cliente','Veículo')}${table(['ID','CLIENTE','VEÍCULO','INÍCIO','FIM PREVISTO','SITUAÇÃO','TOTAL','AÇÕES'],[['16','Marina Costa','Polo','01/12/2026','03/12/2026','<span class="status">Em aberto</span>','—','<span class="action">Ver · Editar · Devolver · Excluir</span>'],['15','Lucas Silva','Argo','17/11/2026','19/11/2026','<span class="status done">Devolvido</span>','R$ 260,00','<span class="action">Ver · Editar · Excluir</span>']])}`)},
devolucao:{caption:'Devolução: operação própria do aluguel registra data, quilometragem final e mostra o total calculado pelo backend.',html:wrap('Aluguéis',`${title('OPERAÇÃO','Registrar devolução','Conclua a locação e atualize a quilometragem da frota.')}<div class="form-layout"><div class="field wide"><label>Aluguel</label><div class="input">#16 · Marina Costa · Polo · 25.000 km inicial</div></div><div class="field"><label>Data e hora da devolução</label><div class="input">03/12/2026 · 09:00</div></div><div class="field"><label>Quilometragem final</label><div class="input">25.120 km</div></div><div class="field wide"><label>Valor da diária</label><div class="input">R$ 150,00</div></div><div class="form-actions"><button class="secondary">Cancelar</button><button class="primary">Registrar devolução</button></div></div><p class="subtitle" style="margin-top:16px">Resposta esperada da API: total de R$ 300,00 para duas diárias.</p>`)},
pagamentos:{caption:'Pagamentos: listagem pesquisável por forma e ID do aluguel, com CRUD completo e vínculo ao aluguel devolvido.',html:wrap('Pagamentos',`${title('OPERAÇÃO','Pagamentos','Valores recebidos por aluguel devolvido.','pagamento')}${filters('Forma de pagamento','ID do aluguel')}${table(['ID','ALUGUEL','DATA','VALOR','FORMA','AÇÕES'],[['37','#15','19/11/2026','R$ 260,00','Pix','<span class="action">Ver · Editar · Excluir</span>'],['36','#14','18/11/2026','R$ 300,00','Cartao','<span class="action">Ver · Editar · Excluir</span>']])}`)},
consultas:{caption:'Consultas: cinco rotas do Trabalho Prático 1, incluindo INNER JOIN e LEFT JOIN, com parâmetros e resultados tabulares.',html:wrap('Consultas',`${title('ANÁLISE DE DADOS','Consultas & filtros','Cinco consultas relacionais disponíveis no backend.')}<div class="query-grid"><div class="query-list">${['Veículos por fabricante','Aluguéis por cliente','Aluguéis abertos','Pagamentos por cliente','Veículos nunca alugados'].map((x,i)=>`<div class="query-item ${i===0?'sel':''}">${x}</div>`).join('')}</div><div class="query-pane"><div class="eyebrow">INNER JOIN · VEÍCULOS + FABRICANTES</div><h3>Veículos por fabricante</h3><p>Encontre os modelos vinculados a uma marca.</p><div class="query-inputs"><div class="field"><label>Fabricante</label><div class="input">Volkswagen</div></div><button class="primary">Executar consulta</button></div><div class="result">2 resultados encontrados</div>${table(['ID','MODELO','PLACA','FABRICANTE'],[['01','Polo','ABC1D23','Volkswagen'],['05','Nivus','GHI3J45','Volkswagen']])}</div></div>`)}}
function show(key){const s=screens[key];document.getElementById('screen').innerHTML=s.html;document.getElementById('caption').textContent=s.caption;document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('active',b.dataset.screen===key));location.hash=key}document.querySelectorAll('.tabs button').forEach(b=>b.addEventListener('click',()=>show(b.dataset.screen)));show(screens[location.hash.slice(1)]?location.hash.slice(1):'visao');
</script>
</body>
</html>
